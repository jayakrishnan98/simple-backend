name: Deploy backend

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-north-1

      - name: Deploy via SSM
        run: |
          aws ssm send-command \
            --instance-ids i-02c1c02e87b1fdff0 \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=["cd /home/ec2-user/simple-backend","sudo -u ec2-user git pull","sudo -u ec2-user ./venv/bin/pip install -r requirements.txt","sudo systemctl restart fastapi"]' \
            --comment "Deploy from GitHub Actions"